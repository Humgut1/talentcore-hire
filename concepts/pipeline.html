<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadence — 공고별 파이프라인 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/JetBrains/JetBrainsMono@v2.304/css/jetbrains-mono.css">
<link rel="stylesheet" href="pipeline.css?v=5">
</head>
<body>

<!-- ================= 아이콘 스프라이트 ================= -->
<svg style="display:none" aria-hidden="true">
  <symbol id="i-mark" viewBox="0 0 24 24"><path d="M5 15V9M12 19V5M19 15V9"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5.5 5h13l2.5 8v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4z"/></symbol>
  <symbol id="i-briefcase" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5.5A1.5 1.5 0 0 1 9.5 4h5A1.5 1.5 0 0 1 16 5.5V7"/><path d="M3 12h18"/></symbol>
  <symbol id="i-check-sq" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 12.5l2.5 2.5L16 9.5"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 5.5a3.2 3.2 0 0 1 0 6"/><path d="M18 14.5a6 6 0 0 1 3 5.5"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20a7 7 0 0 1 14 0"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4l2.4 5 5.6.8-4 3.9 1 5.5-5-2.6-5 2.6 1-5.5-4-3.9 5.6-.8z"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20h17"/><path d="M6 20v-6M11 20V7M16 20v-9"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M8 11.5l4 4 4-4"/><path d="M4 19h16"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4.5L21 19.5H3z"/><path d="M12 10v4M12 17h.01"/></symbol>
  <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.2l2.4 2.4 4.6-4.8"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="M15 10.5l6-3.5v10l-6-3.5z"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M4 4l16 16"/><path d="M9.9 5.3A9 9 0 0 1 21 12a13 13 0 0 1-2.7 3.4M6.2 7.2A13 13 0 0 0 3 12a9 9 0 0 0 12.4 5.1"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 5h11l-1.5 3.5L16 12H5z"/></symbol>
</svg>

<div class="app">

  <!-- ================= 사이드바 ================= -->
  <aside class="side">
    <div class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24"><use href="#i-mark"/></svg></span>
      <span class="brand-name">Cadence</span>
      <span class="brand-tag">임시명</span>
    </div>

    <div class="nav-sec">
      <p>내 화면</p>
      <div class="nav-i"><svg class="ic"><use href="#i-inbox"/></svg>조율 처리함 <span class="badge">3</span></div>
      <div class="nav-i"><svg class="ic"><use href="#i-star"/></svg>내 포지션</div>
      <div class="nav-i"><svg class="ic"><use href="#i-check-sq"/></svg>내 할 일</div>
    </div>

    <div class="nav-sec">
      <p>채용</p>
      <div class="nav-i on"><svg class="ic"><use href="#i-briefcase"/></svg>공고</div>
      <div class="nav-i"><svg class="ic"><use href="#i-users"/></svg>후보자</div>
      <div class="nav-i"><svg class="ic"><use href="#i-calendar"/></svg>일정</div>
      <div class="nav-i"><svg class="ic"><use href="#i-check-sq"/></svg>평가</div>
      <div class="nav-i"><svg class="ic"><use href="#i-flag"/></svg>오퍼</div>
    </div>

    <div class="nav-sec">
      <p>운영</p>
      <div class="nav-i"><svg class="ic"><use href="#i-chart"/></svg>대시보드</div>
      <div class="nav-i"><svg class="ic"><use href="#i-download"/></svg>내보내기</div>
      <div class="nav-i"><svg class="ic"><use href="#i-sliders"/></svg>설정</div>
    </div>

    <div class="side-foot">
      <span class="avatar">정</span>
      <div><div class="who">정수민</div><div class="role">리크루터</div></div>
    </div>
  </aside>

  <!-- ================= 본문 ================= -->
  <main class="main">

    <header class="top">
      <div class="crumb">
        <svg class="ic ic-sm"><use href="#i-briefcase"/></svg>공고<span class="sep">/</span>플랫폼본부
      </div>

      <div class="h-row">
        <h1>백엔드 엔지니어 (시니어)</h1>
        <span class="pill"><i class="dot"></i>오픈</span>
      </div>

      <div class="meta">
        <i><svg class="ic ic-sm"><use href="#i-users"/></svg>플랫폼본부 <b>서버팀</b></i>
        <i><svg class="ic ic-sm"><use href="#i-user"/></svg>리크루터 <b>정수민</b></i>
        <i><svg class="ic ic-sm"><use href="#i-star"/></svg>HM <b>최영수</b></i>
        <i><svg class="ic ic-sm"><use href="#i-clock"/></svg>오픈 <b>D+23</b></i>
      </div>

      <nav class="tabs">
        <button class="tab on">시안 A<u>스테이지 보드</u></button>
        <button class="tab">시안 B<u>진행 레일</u></button>
        <button class="tab">시안 C<u>트리아지 큐</u></button>
      </nav>
    </header>

    <div class="bar" id="bar"></div>

    <div class="stage">
      <section class="pane on" id="pane-a"></section>
      <section class="pane"    id="pane-b"></section>
      <section class="pane"    id="pane-c"></section>
      <p class="disclaimer">※ 화면은 기능 설명을 위한 예시 데이터입니다. 실제 지표가 아닙니다.</p>
    </div>

  </main>
</div>

<script src="pipeline.js?v=5"></script>
</body>
</html>
